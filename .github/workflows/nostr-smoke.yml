name: Nostr Smoke — relays de sinalização (REV-19)

# Publica e lê um evento EFÊMERO (kind 25050, não é guardado pelos relays) em cada relay
# de client/config/signaling.json e grava a taxa de sucesso no resumo do job e num artefato.
# Pré-requisito da sinalização por Nostr (REV-09). Ver docs/research/pesquisa-complementar-2026-11.md §1-G.

on:
  schedule:
    - cron: "17 9 * * 1" # segundas, 09:17 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: nostr-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Testar relays Nostr
        run: node scripts/nostr-smoke.mjs --json nostr-smoke.json --timeout 8000 --signaling
      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nostr-smoke-${{ github.run_id }}
          path: nostr-smoke.json
          retention-days: 90

      - name: Alerta vira issue (PM-61)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "Alerta: teste de fumaça Nostr falhou"
        run: |
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create alerta-automatico --repo "$repo" --color B60205 \
            --description "Falha de rotina agendada ou de deploy (PM-61)" 2>/dev/null || true
          existing=$(gh issue list --repo "$repo" --state open --label alerta-automatico \
            --search "\"$ALERT_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing já aberta para este alerta; não abro outra."
            exit 0
          fi
          gh issue create --repo "$repo" --label alerta-automatico --title "$ALERT_TITLE" \
            --body "A execução $run_url falhou em $(date -u +%Y-%m-%dT%H:%MZ). Feche esta issue quando resolver; enquanto ela estiver aberta, novas falhas não abrem outra. Runbook: docs/operations/runbook-incidentes.md"
