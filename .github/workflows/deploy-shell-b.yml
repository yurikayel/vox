# NET-01 / T2 — espelho shell B (Cloudflare Pages)
# Automatizado: dispara em push na main ou workflow_dispatch.
# Sem token Cloudflare = no-op honesto (aviso no log).

name: Deploy shell B — Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - "client/**"
      - "docs/**"
      - "scripts/write-oauth-deploy-config.mjs"
      - ".github/workflows/deploy-shell-b.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite DEPLOY para publicar _site no projeto Pages configurado"
        required: false
        default: "DEPLOY"
        type: string

permissions:
  issues: write
  contents: read

concurrency:
  group: shell-b-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar client/ no Cloudflare Pages (B)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY'
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verificar secrets (no-op se faltarem)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          [ -z "$CF_PROJECT" ] && missing="${missing} CLOUDFLARE_PAGES_PROJECT_NAME"
          if [ -n "$missing" ]; then
            echo "::notice title=Shell B não publicado::Faltam secrets no repositório:${missing}. Configure no GitHub (Settings → Secrets) e dispare de novo. Nenhum URL foi alterado."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Preparar site estático (_site)
        if: env.skip != 'true'
        env:
          VOX_GOOGLE_CLIENT_ID: ${{ secrets.VOX_GOOGLE_CLIENT_ID }}
          VOX_FACEBOOK_APP_ID: ${{ secrets.VOX_FACEBOOK_APP_ID }}
        run: |
          mkdir -p _site
          cp -r client/* _site/
          if [ -f docs/product/proposta-vox.html ]; then
            cp docs/product/proposta-vox.html _site/proposta-vox.html
          fi
          node scripts/write-oauth-deploy-config.mjs

      - name: Upload para Cloudflare Pages
        if: env.skip != 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main --commit-dirty=true

      - name: Alerta vira issue (PM-61)
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "Alerta: deploy do shell B falhou"
        run: |
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create alerta-automatico --repo "$repo" --color B60205 \
            --description "Falha de rotina agendada ou de deploy (PM-61)" 2>/dev/null || true
          existing=$(gh issue list --repo "$repo" --state open --label alerta-automatico \
            --search "\"$ALERT_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing já aberta para este alerta; não abro outra."
            exit 0
          fi
          gh issue create --repo "$repo" --label alerta-automatico --title "$ALERT_TITLE" \
            --body "A execução $run_url falhou em $(date -u +%Y-%m-%dT%H:%MZ). Feche esta issue quando resolver; enquanto ela estiver aberta, novas falhas não abrem outra. Runbook: docs/operations/runbook-incidentes.md"
