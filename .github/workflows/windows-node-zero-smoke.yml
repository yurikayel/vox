name: Windows Node Zero smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node-zero:
    name: Build and exercise VoxPopuli Node Zero
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Verify effective loopback sockets and legacy settings
        run: python -m unittest discover -s packaging/node-zero-windows -p test_network_contract.py -v

      - name: Build and smoke-test in temporary directories
        shell: pwsh
        run: .\packaging\node-zero-windows\smoke-test.ps1

      - name: Verify safe port-collision preflight
        shell: pwsh
        run: .\packaging\node-zero-windows\test-smoke-preflight.ps1

      - name: Genesis cutoff in the C# node (ZeroCentralMemory)
        shell: pwsh
        run: .\packaging\zero-central-memory-windows\tests\test-genesis-guard.ps1
