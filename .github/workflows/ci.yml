name: CI — Testes & Validação

# runs-on ubuntu-latest: GitHub will migrate default to Ubuntu 26 (~Oct 2026); pin ubuntu-24.04 only if you need a fixed image.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-client:
    name: Cliente PWA (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependências (ESLint / audit)
        run: npm ci

      - name: Verificação de sintaxe JS
        run: |
          find client/js -name '*.js' -print0 | xargs -0 node --check
          node --check client/sw.js

      - name: Auditoria de complexidade (baseline)
        run: npm run audit:complexity

      - name: Upload baseline métricas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complexity-baseline-node-${{ matrix.node-version }}
          path: docs/metrics/baseline-*.json
          if-no-files-found: ignore

      - name: ESLint client (warn-only)
        run: npm run lint
        continue-on-error: true

      - name: Executar testes unitários do cliente (node:test)
        run: |
          npm run test:client

  test-relay:
    name: Relay & Signaling (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verificação de sintaxe Python
        run: |
          python -m py_compile relay/*.py

      - name: Executar testes unitários do relay (unittest)
        run: |
          npm run test:relay

      - name: Ruff relay (opcional)
        run: pip install ruff && npm run lint:relay
        continue-on-error: true

  security-audit:
    name: Auditoria de Segurança (Secrets / Chaves)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Verificar ausência de chaves privadas ou JWK reais commitados
        run: |
          echo "Verificando se há chaves privadas acidentalmente no repositório..."
          ! grep -rnw "BEGIN RSA PRIVATE KEY" . --exclude-dir=.git --exclude-dir=.github || exit 1
          ! grep -rnw "BEGIN PRIVATE KEY" . --exclude-dir=.git --exclude-dir=.github || exit 1
          echo "Nenhuma chave privada encontrada no repositório. OK!"
