name: CI — Testes & Validação

# Suíte local: node:test (cliente) + unittest (relay) — npm test na raiz.
# Contagens canônicas: docs/release-metadata.json (npm run release-metadata).
# runs-on ubuntu-latest: GitHub will migrate default to Ubuntu 26 (~Oct 2026); pin ubuntu-24.04 only if you need a fixed image.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# PM-95: o token do CI só lê o repositório.
permissions:
  contents: read

jobs:
  test-client:
    name: Cliente PWA (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependências (ESLint / audit)
        run: npm ci

      - name: Auditoria de dependências (LAN-20)
        run: npm audit --audit-level=high

      - name: Verificação de sintaxe JS
        run: |
          find client/js -name '*.js' -print0 | xargs -0 node --check
          node --check client/sw.js

      - name: Auditoria de complexidade (baseline)
        run: npm run audit:complexity

      - name: Upload baseline métricas
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: complexity-baseline-node-${{ matrix.node-version }}
          path: docs/metrics/baseline-*.json
          if-no-files-found: ignore

      - name: ESLint client (limites de função e complexidade bloqueiam)
        run: npm run lint

      - name: Executar testes unitários do cliente (node:test)
        run: |
          npm run test:client

  test-relay:
    name: Relay & Signaling (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verificação de sintaxe Python
        run: |
          python -m py_compile relay/*.py

      - name: Executar testes unitários do relay (unittest)
        run: |
          npm run test:relay

      - name: Ruff (pyflakes e complexidade > 15 bloqueiam)
        run: pip install ruff==0.17.4 && npm run lint:relay

      - name: Ruff — dívida de estilo e de tamanho de função (só informa)
        run: ruff check relay scripts packaging --select E,I,PLR0915 --exit-zero --statistics

  security-audit:
    name: Auditoria de Segurança (Secrets / Chaves)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar ausência de chaves privadas (PEM) e JWK privadas commitadas
        run: node scripts/secrets-audit.mjs

  pilot-freeze:
    name: Piloto V-P09 — freeze client/js (opt-in)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detectar freeze ativo
        id: freeze
        run: |
          if [ "${{ vars.PILOT_FREEZE }}" = "1" ] || [ -f .github/pilot-freeze.flag ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bloquear mudanças em client/js sem pilot-hotfix
        if: steps.freeze.outputs.active == 'true'
        env:
          BASE: ${{ github.base_ref }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch origin "$BASE"
          CHANGED="$(git diff --name-only "origin/${BASE}...HEAD" | grep '^client/js/' || true)"
          if [ -z "$CHANGED" ]; then
            echo "Nenhuma alteração em client/js — OK."
            exit 0
          fi
          echo "$CHANGED"
          if echo "$LABELS_JSON" | grep -q 'pilot-hotfix'; then
            echo "Label pilot-hotfix presente — OK."
            exit 0
          fi
          if git log --format=%s "origin/${BASE}..HEAD" | grep -qi 'pilot-hotfix'; then
            echo "Commit message pilot-hotfix — OK."
            exit 0
          fi
          echo "::error::PILOT_FREEZE ativo: PR altera client/js/**. Use label pilot-hotfix ou desative o freeze."
          exit 1
