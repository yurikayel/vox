name: Deploy PWA — GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "client/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site composto (_site)
        run: |
          mkdir -p _site
          cp -r client/* _site/
          if [ -f docs/proposta-vox.html ]; then
            cp docs/proposta-vox.html _site/proposta-vox.html
          fi

      - name: Upload de artefato do PWA (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
