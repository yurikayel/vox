name: Deploy PWA — GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "client/**"
      - "docs/**"
      - "scripts/write-oauth-deploy-config.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Preparar site composto (_site)
        env:
          VOX_GOOGLE_CLIENT_ID: ${{ secrets.VOX_GOOGLE_CLIENT_ID }}
          VOX_FACEBOOK_APP_ID: ${{ secrets.VOX_FACEBOOK_APP_ID }}
          # Login social: IDs PÚBLICOS dos apps (segredos ficam só no relay) + URL do relay.
          VOX_X_CLIENT_ID: ${{ vars.VOX_X_CLIENT_ID }}
          VOX_GITHUB_CLIENT_ID: ${{ vars.VOX_GITHUB_CLIENT_ID }}
          VOX_THREADS_APP_ID: ${{ vars.VOX_THREADS_APP_ID }}
          VOX_TIKTOK_CLIENT_KEY: ${{ vars.VOX_TIKTOK_CLIENT_KEY }}
          VOX_INSTAGRAM_APP_ID: ${{ vars.VOX_INSTAGRAM_APP_ID }}
          VOX_OAUTH_RELAY_URL: ${{ vars.VOX_OAUTH_RELAY_URL }}
          VOX_SITE_URL: ${{ vars.VOX_SITE_URL }}
        run: |
          mkdir -p _site
          cp -r client/* _site/
          touch _site/.nojekyll
          if [ -f docs/product/proposta-vox.html ]; then
            cp docs/product/proposta-vox.html _site/proposta-vox.html
          fi
          node scripts/write-oauth-deploy-config.mjs

      - name: Upload de artefato do PWA (_site)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./_site"

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
