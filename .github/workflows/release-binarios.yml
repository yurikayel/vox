# PM-45 — os binários da página de download saem daqui, não de uma máquina pessoal.
# PR que mexe em android/ ou packaging/: só compila (prova que o build funciona).
# Tag v*: compila, gera SHA256SUMS, atesta a origem e publica a GitHub Release.
# Manual (workflow_dispatch): compila, atesta e deixa os arquivos como artifact.
name: Binários — build e release

on:
  pull_request:
    paths:
      - "android/**"
      - "packaging/node-zero-windows/**"
      - "packaging/desktop-windows-native/**"
      - ".github/workflows/release-binarios.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Vox.exe, VoxPopuli.exe e APKs
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: VoxPopuli.exe (PyInstaller)
        shell: pwsh
        run: .\packaging\node-zero-windows\build.ps1

      - name: Vox.exe (csc + WebView2)
        shell: pwsh
        run: .\packaging\desktop-windows-native\build.ps1

      - name: Android SDK (build-tools 35, android-35)
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $sdkmanager) { throw "sdkmanager não encontrado em $env:ANDROID_HOME" }
          "y`ny`ny`n" | & $sdkmanager.FullName "build-tools;35.0.0" "platforms;android-35" | Out-Null

      - name: vox.apk e vox-populi.apk
        shell: pwsh
        run: |
          $env:VOX_JAVA_HOME = if ($env:JAVA_HOME_21_X64) { $env:JAVA_HOME_21_X64 } else { $env:JAVA_HOME_17_X64 }
          .\android\build.ps1

      - name: Juntar arquivos e SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\VoxPopuli.exe, dist\Vox.exe, android\vox.apk, android\vox-populi.apk out\
          Push-Location out
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location
          Get-Content out\SHA256SUMS | ForEach-Object { "``$_``" } | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Atestação de origem
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "out/*"

      - name: Guardar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox-binarios
          path: out/
          retention-days: 14

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Compilado pelo CI a partir de $env:GITHUB_SHA. Confira com SHA256SUMS ou com: gh attestation verify <arquivo> --repo $env:GITHUB_REPOSITORY"
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem out -File).FullName --title $env:GITHUB_REF_NAME --notes $notes
