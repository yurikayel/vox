name: Sentinel Keepalive — Nós Base 24/7

on:
  schedule:
    # A cada 14 minutos (mantém instâncias gratuitas como Render e Koyeb ativas sem adormecer)
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: sentinel-keepalive
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  ping:
    name: Ping Nós Base (Sentinelas Vox)
    runs-on: ubuntu-latest
    steps:
      - name: Executar pings de prontidão nos nós sentinelas
        id: ping
        env:
          SENTINEL_NODE_1: ${{ secrets.SENTINEL_NODE_1 }}
          SENTINEL_NODE_2: ${{ secrets.SENTINEL_NODE_2 }}
          SENTINEL_NODE_3: ${{ secrets.SENTINEL_NODE_3 }}
        run: |
          echo "=============================================="
          echo "  Vox Sentinel Keepalive Ping"
          echo "=============================================="

          nodes=()
          [ -n "$SENTINEL_NODE_1" ] && nodes+=("$SENTINEL_NODE_1")
          [ -n "$SENTINEL_NODE_2" ] && nodes+=("$SENTINEL_NODE_2")
          [ -n "$SENTINEL_NODE_3" ] && nodes+=("$SENTINEL_NODE_3")

          if [ ${#nodes[@]} -eq 0 ]; then
            # Deno Deploy pausado (organização suspensa) — só o nó Render entra no ping padrão.
            echo "Nenhum segredo manual configurado. Usando o nó ativo padrão (Render)."
            nodes+=("https://vox-sentinel.onrender.com")
          fi

          failed=0
          for node in "${nodes[@]}"; do
            clean_url=$(echo "$node" | sed 's|/$||')
            if [[ ! "$clean_url" =~ ^https?:// ]]; then
              clean_url="https://${clean_url}"
            fi
            health_url="${clean_url}/health"

            echo "Testando nó: $health_url ..."
            response=$(curl -s -S -m 15 -w "\nHTTP_STATUS:%{http_code}\nTIME:%{time_total}s" "$health_url" || true)
            http_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2)
            req_time=$(echo "$response" | grep "TIME:" | cut -d':' -f2)

            if [ "$http_code" = "200" ]; then
              echo "  [OK] Nó ativo! Status 200 em ${req_time}"
            else
              echo "  [ALERTA] Falha no nó ($clean_url) — Código HTTP: ${http_code:-timeout}"
              failed=$((failed + 1))
            fi
          done

          echo "=============================================="
          echo "Ping concluído: $((${#nodes[@]} - failed))/${#nodes[@]} nós ativos."
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "=============================================="

      - name: Alerta vira issue (PM-61)
        if: steps.ping.outputs.failed != '0' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "Alerta: nó de sinalização (Render) sem resposta no keepalive"
        run: |
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create alerta-automatico --repo "$repo" --color B60205 \
            --description "Falha de rotina agendada ou de deploy (PM-61)" 2>/dev/null || true
          existing=$(gh issue list --repo "$repo" --state open --label alerta-automatico \
            --search "\"$ALERT_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing já aberta para este alerta; não abro outra."
            exit 0
          fi
          gh issue create --repo "$repo" --label alerta-automatico --title "$ALERT_TITLE" \
            --body "A execução $run_url falhou em $(date -u +%Y-%m-%dT%H:%MZ). Feche esta issue quando resolver; enquanto ela estiver aberta, novas falhas não abrem outra. Runbook: docs/operations/runbook-incidentes.md"
