name: Dependências — rotina mensal (LAN-20)

# Inventário em docs/DEPENDENCIAS.md. Falha quando: vulnerabilidade alta no npm,
# código carregando algo fora do inventário, ou hash de CDN diferente do anotado.

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  deps:
    name: Auditoria mensal de dependências
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Instalar dependências do lock
        run: npm ci

      - name: npm audit (alto ou crítico falha)
        run: npm audit --audit-level=high

      - name: Inventário cobre o que o código carrega
        run: node --test tests/dependencias-inventory.test.js

      - name: Hashes de CDN batem com o inventário
        run: node scripts/deps-check-cdn.mjs

      - name: Versões desatualizadas (só informa)
        if: always()
        run: |
          {
            echo "### npm outdated"
            echo '```'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alerta vira issue (PM-61)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "Alerta: rotina mensal de dependências falhou"
        run: |
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create alerta-automatico --repo "$repo" --color B60205 \
            --description "Falha de rotina agendada ou de deploy (PM-61)" 2>/dev/null || true
          existing=$(gh issue list --repo "$repo" --state open --label alerta-automatico \
            --search "\"$ALERT_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing já aberta para este alerta; não abro outra."
            exit 0
          fi
          gh issue create --repo "$repo" --label alerta-automatico --title "$ALERT_TITLE" \
            --body "A execução $run_url falhou em $(date -u +%Y-%m-%dT%H:%MZ). Feche esta issue quando resolver; enquanto ela estiver aberta, novas falhas não abrem outra. Runbook: docs/operations/runbook-incidentes.md"
