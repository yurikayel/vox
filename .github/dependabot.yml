# PM-95: Dependabot para npm (ESLint e ferramentas), Docker (imagem do relay) e GitHub Actions
# (fixadas por SHA; o Dependabot atualiza o SHA e o comentário de versão juntos).
# O relay usa só a stdlib do Python (relay/requirements.txt vazio), então não há pip.
# A rotina mensal (deps-mensal.yml, LAN-20) continua para o que não tem manifesto (CDN, vendor).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-dev:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/relay"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: [ "*" ]
    commit-message:
      prefix: "chore(ci)"
