services:
  vox-signaling:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vox-signaling
    restart: unless-stopped
    expose:
      - "3921"

  caddy:
    image: caddy:2-alpine
    container_name: vox-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vox-signaling

  coturn:
    image: coturn/coturn:latest
    container_name: vox-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  caddy_data:
  caddy_config:
