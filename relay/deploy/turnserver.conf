# Configuração Coturn Hardened — Vox TURN Comunitário (Fase 3.3)
# Destinado a destravar WebRTC entre celulares em 4G/5G com NAT simétrico.

listening-port=3478
min-port=49152
max-port=49200

# Substitua pelo IP público da sua VPS se ela estiver atrás de NAT (ex: AWS/Oracle Cloud):
# external-ip=SEU_IP_PUBLICO

fingerprint
lt-cred-mech

# Troque a senha abaixo antes de subir em produção!
user=vox:troque-esta-senha-comunitaria
realm=vox.comunidade.org

# Limites de proteção para evitar abuso de banda na VPS
total-quota=100
max-bps=512000
stale-nonce=600

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Proteção anti-SSRF (bloqueia redirecionamento para redes privadas internas)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
