# Configuração Coturn Hardened — Vox TURN Comunitário (Fase 3.3)
# Destinado a destravar WebRTC entre celulares em 4G/5G com NAT simétrico.

listening-port=3478
min-port=49152
max-port=49200

# Substitua pelo IP público da sua VPS se ela estiver atrás de NAT (ex: AWS/Oracle Cloud):
# external-ip=SEU_IP_PUBLICO

fingerprint
lt-cred-mech

# Credencial TURN: o arquivo NÃO traz senha utilizável. O placeholder abaixo faz o coturn
# recusar autenticação até você definir a credencial real (falha fechada, não aberta).
# O coturn não lê variáveis de ambiente neste arquivo; defina a senha assim (runbook, deploy/README.md):
#   1. Gere uma senha forte:   openssl rand -hex 24
#   2. Troque o placeholder na sua CÓPIA de produção do arquivo (ex.: turnserver.prod.conf,
#      fora do git): user=vox:<senha gerada>
#   3. Guarde a senha no cofre da comunidade; nunca a comite nem a cole em issue/PR.
# O compose monta ./turnserver.conf; suba com a cópia de produção ajustando o volume, ou
# substitua o placeholder localmente antes do deploy.
user=vox:__DEFINIR_SENHA_TURN__
realm=vox.comunidade.org

# Limites de proteção para evitar abuso de banda na VPS
total-quota=100
max-bps=512000
stale-nonce=600

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Proteção anti-SSRF (bloqueia redirecionamento para redes privadas internas)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
