<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img">
  <title>Porta da Cantina</title>
  <desc>Bartender at a desert bar door, hand raised. Stylized bots wait on the sidewalk; people talk inside.</desc>
  <!-- Original Vox art. Flat desert sci-fi. No 404, no Octocat, no film frame. -->

  <rect width="640" height="152" fill="#7eb8d4"/>
  <rect y="152" width="640" height="88" fill="#f0d9a0"/>
  <ellipse cx="80" cy="156" rx="64" ry="9" fill="#e8cc8c"/>
  <path d="M48 152c6-20 18-30 22-30s16 10 22 30" fill="#c9a86a"/>
  <rect x="392" y="168" width="248" height="8" fill="#d8b46e"/>
  <rect x="392" y="176" width="248" height="64" fill="#e2c07c"/>

  <g class="cantina-bubble">
    <rect x="20" y="36" width="168" height="90" rx="16" fill="#fffef8"/>
    <path d="M168 108l24 18-32-10z" fill="#fffef8"/>
    <text x="38" y="66" fill="#2c3e50" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Aqui n&#227;o</text>
    <text x="38" y="88" fill="#2c3e50" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">servimos</text>
    <text x="38" y="110" fill="#2c3e50" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">esse tipo.</text>
  </g>

  <g class="cantina-bartender" transform="translate(206 46)">
    <ellipse cx="40" cy="112" rx="26" ry="6" fill="#d4b06a"/>
    <path d="M12 112c2-50 12-66 28-70 16 4 26 20 28 70-12 8-44 8-56 0z" fill="#efe2c4"/>
    <path d="M28 74h24v38c-4 7-20 7-24 0z" fill="#d4b88a"/>
    <ellipse cx="40" cy="36" rx="17" ry="19" fill="#e8c4a0"/>
    <path d="M24 38c1-16 8-24 12-26 3 9 2 18-1 24z" fill="#3d2a1c"/>
    <path d="M56 38c-1-16-8-24-12-26-3 9-2 18 1 24z" fill="#3d2a1c"/>
    <circle cx="33" cy="36" r="1.8" fill="#2a1810"/>
    <circle cx="47" cy="36" r="1.8" fill="#2a1810"/>
    <path d="M34 45h12" stroke="#2a1810" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M68 78c18-2 30 8 34 18" stroke="#efe2c4" stroke-width="12" stroke-linecap="round"/>
    <circle cx="104" cy="98" r="7" fill="#e8c4a0"/>
    <path d="M16 82c-14 6-18 16-16 24" stroke="#efe2c4" stroke-width="12" stroke-linecap="round"/>
    <rect x="-2" y="100" width="11" height="13" rx="2" fill="#b4531e"/>
    <rect x="0" y="104" width="7" height="3" rx="1" fill="#f0d9a0"/>
  </g>

  <g transform="translate(348 116)">
    <ellipse cx="18" cy="48" rx="16" ry="5" fill="#d4b06a"/>
    <rect x="4" y="4" width="28" height="34" rx="7" fill="#6d7d89"/>
    <rect x="9" y="14" width="18" height="9" rx="2" fill="#1b242c"/>
    <circle class="cantina-bot-led" cx="15" cy="18.5" r="2.3" fill="#f5b942"/>
    <circle class="cantina-bot-led" cx="23" cy="18.5" r="2.3" fill="#f5b942"/>
    <rect x="8" y="38" width="9" height="9" rx="1.5" fill="#55636d"/>
    <rect x="19" y="38" width="9" height="9" rx="1.5" fill="#55636d"/>
    <line x1="18" y1="4" x2="18" y2="-8" stroke="#55636d" stroke-width="2"/>
    <circle cx="18" cy="-10" r="3.4" fill="#f59e0b"/>
  </g>

  <g transform="translate(394 140)">
    <ellipse cx="16" cy="32" rx="14" ry="4" fill="#d4b06a"/>
    <rect x="2" y="4" width="28" height="22" rx="9" fill="#80919c"/>
    <rect x="8" y="11" width="16" height="7" rx="2" fill="#1b242c"/>
    <rect x="6" y="26" width="9" height="7" rx="1.5" fill="#55636d"/>
    <rect x="17" y="26" width="9" height="7" rx="1.5" fill="#55636d"/>
    <circle cx="9" cy="8" r="2.2" fill="#9aabb6"/>
  </g>

  <g transform="translate(430 36)">
