    <path class="cantina-door-glow" d="M62 132V78a32 36 0 0 1 64 0v54z" fill="#5c3010"/>
    <g fill="#2a160c" opacity=".88">
      <ellipse cx="82" cy="98" rx="7" ry="8"/>
      <rect x="75" y="105" width="14" height="22" rx="4"/>
      <ellipse cx="108" cy="96" rx="7" ry="8"/>
      <rect x="101" y="103" width="14" height="24" rx="4"/>
    </g>
    <ellipse cx="94" cy="110" rx="34" ry="22" fill="#f5c14a" opacity=".22"/>
    <circle cx="94" cy="58" r="5" fill="#ffe08a"/>
    <line x1="94" y1="22" x2="94" y2="53" stroke="#8a6a3e" stroke-width="2"/>
  </g>
