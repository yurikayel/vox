<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <pattern id="revolucao-mesh" width="96" height="96" patternUnits="userSpaceOnUse">
      <!-- Linhas diagonais estruturais de andaime (45 graus) -->
      <path d="M 0 96 L 96 0 M -24 72 L 72 -24 M 24 120 L 120 24" fill="none" stroke="rgba(220, 38, 38, 0.04)" stroke-width="1.2"/>
      <path d="M 0 0 L 96 96 M -24 24 L 24 -24 M 72 120 L 120 72" fill="none" stroke="rgba(220, 38, 38, 0.025)" stroke-width="0.8" stroke-dasharray="3 6"/>
      <!-- Linhas horizontais e verticais de amarração proletária -->
      <line x1="0" y1="48" x2="96" y2="48" stroke="rgba(245, 158, 11, 0.03)" stroke-width="0.8"/>
      <line x1="48" y1="0" x2="48" y2="96" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.8"/>
      <!-- Nós de rede de telecomunicação comunitária nas junções -->
      <circle cx="48" cy="48" r="1.8" fill="rgba(220, 38, 38, 0.22)"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(245, 158, 11, 0.2)"/>
      <circle cx="96" cy="0" r="1.5" fill="rgba(245, 158, 11, 0.2)"/>
      <circle cx="0" cy="96" r="1.5" fill="rgba(245, 158, 11, 0.2)"/>
      <circle cx="96" cy="96" r="1.5" fill="rgba(245, 158, 11, 0.2)"/>
      <!-- Pequenas travas de andaime -->
      <path d="M 44 48 L 52 48 M 48 44 L 48 52" stroke="rgba(220, 38, 38, 0.15)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#revolucao-mesh)" />
</svg>
