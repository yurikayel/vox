<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="auto" style="background:#080C14; border-radius:14px; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gradNecessary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradSurplus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#DC2626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Cabeçalho do Gráfico -->
  <text x="40" y="44" fill="#F8FAFC" font-size="20" font-weight="800" letter-spacing="-0.02em">A Anatomia da Mais-Valia na Escala 6x1</text>
  <text x="40" y="68" fill="#94A3B8" font-size="13" font-family="'JetBrains Mono', monospace">DIAGNÓSTICO MATERIALISTA • TEMPO DE TRABALHO SOCIALMENTE NECESSÁRIO vs. EXPROPRIAÇÃO</text>

  <!-- Régua de 12 Horas de Jornada + Deslocamento Precarizado -->
  <g transform="translate(40, 95)">
    <!-- Barra Fundo -->
    <rect x="0" y="20" width="880" height="74" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />

    <!-- Fração 1: Trabalho Socialmente Necessário (2h) -->
    <rect x="0" y="20" width="176" height="74" rx="10" fill="url(#gradNecessary)" />
    <!-- Fix canto direito retangular para emendar -->
    <rect x="160" y="20" width="16" height="74" fill="url(#gradNecessary)" />

    <text x="24" y="52" fill="#FFFFFF" font-size="15" font-weight="800">~2 HORAS</text>
    <text x="24" y="73" fill="#D1FAE5" font-size="12" font-weight="600">Trabalho Necessário</text>

    <!-- Fração 2: Mais-Valia Absoluta e Relativa (10h+) -->
    <rect x="176" y="20" width="704" height="74" rx="10" fill="url(#gradSurplus)" filter="url(#glowRed)" />
    <rect x="176" y="20" width="16" height="74" fill="url(#gradSurplus)" />

    <text x="200" y="52" fill="#FFFFFF" font-size="15" font-weight="800">10 HORAS + ESCALA 6x1 (TRABALHO EXCEDENTE)</text>
    <text x="200" y="73" fill="#FEE2E2" font-size="12" font-weight="600">Mais-Valia Monopolizada • Lucro de Plataformas, Fundos Financeiros e Vigilância Imperialista</text>

    <!-- Marcadores de Horas -->
    <line x1="0" y1="102" x2="880" y2="102" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    
    <text x="0" y="122" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace">0h (Início)</text>
    <text x="170" y="122" fill="#10B981" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">2h (Salário Pago)</text>
    <text x="440" y="122" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace">6h</text>
    <text x="660" y="122" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace">9h</text>
    <text x="830" y="122" fill="#EF4444" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">12h+ (Exaustão)</text>
  </g>

  <!-- Três Pilares da Crítica Materialista -->
  <g transform="translate(40, 255)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="76" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1" />
    <circle cx="24" cy="26" r="6" fill="#10B981" />
    <text x="40" y="30" fill="#F8FAFC" font-size="13" font-weight="700">Reprodução da Força</text>
    <text x="24" y="52" fill="#94A3B8" font-size="11.5" line-height="1.4">Em menos de 2 horas o operário produz o equivalente a seu salário mínimo real.</text>

    <!-- Card 2 -->
    <rect x="300" y="0" width="280" height="76" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1" />
    <circle cx="324" cy="26" r="6" fill="#DC2626" />
    <text x="340" y="30" fill="#F8FAFC" font-size="13" font-weight="700">O Trapiche Algorítmico</text>
    <text x="324" y="52" fill="#94A3B8" font-size="11.5">Bloqueios arbitrários, escala 6x1 e rotas opacas forçam sobretrabalho sem direitos.</text>

    <!-- Card 3 -->
    <rect x="600" y="0" width="280" height="76" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1" />
    <circle cx="624" cy="26" r="6" fill="#F59E0B" />
    <text x="640" y="30" fill="#F8FAFC" font-size="13" font-weight="700">A Resposta Vox</text>
    <text x="624" y="52" fill="#94A3B8" font-size="11.5">Sem publicidade comercial. Apoio solidário via Pix Zaps direto: 100% de trabalhador para trabalhador.</text>
  </g>
</svg>
