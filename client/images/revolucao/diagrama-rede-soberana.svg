<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="auto" style="background:#070A10; border-radius:14px; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gradBadBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0D10" />
      <stop offset="100%" stop-color="#0E080A" />
    </linearGradient>
    <linearGradient id="gradGoodBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1B14" />
      <stop offset="100%" stop-color="#070E0B" />
    </linearGradient>
  </defs>

  <!-- Cabeçalho -->
  <text x="40" y="44" fill="#F8FAFC" font-size="20" font-weight="800" letter-spacing="-0.02em">Topologia Comparativa: Nuvem Monopolista vs. Malha Operária</text>
  <text x="40" y="68" fill="#94A3B8" font-size="13" font-family="'JetBrains Mono', monospace">INFRAESTRUTURA MATERIAL • CENTRALIZAÇÃO IMPERIALISTA vs. SOBERANIA LOCAL-FIRST</text>

  <!-- Painel Esquerdo: Nuvem Monopolista (Big Tech) -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="425" height="270" rx="12" fill="url(#gradBadBox)" stroke="#DC2626" stroke-width="1.2" stroke-opacity="0.4" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="135" height="24" rx="12" fill="#7F1D1D" />
    <text x="32" y="36" fill="#FEE2E2" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">BIG TECH / NUVEM</text>

    <text x="20" y="70" fill="#FFFFFF" font-size="16" font-weight="800">O Panóptico do Algoritmo</text>
    <text x="20" y="90" fill="#94A3B8" font-size="12">Infraestrutura sob comando do capital financeiro transnacional</text>

    <!-- Diagrama Visual Centro-Periferia -->
    <g transform="translate(20, 110)">
      <!-- Servidor Central Imperialista -->
      <circle cx="190" cy="45" r="30" fill="#2A0B0E" stroke="#EF4444" stroke-width="2" />
      <text x="190" y="43" fill="#FCA5A5" font-size="10" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', monospace">DATACENTER</text>
      <text x="190" y="55" fill="#EF4444" font-size="9" text-anchor="middle">EUA / NUVEM</text>

      <!-- Nós Submissos -->
      <circle cx="50" cy="35" r="14" fill="#1E293B" stroke="#64748B" />
      <circle cx="100" cy="95" r="14" fill="#1E293B" stroke="#64748B" />
      <circle cx="280" cy="95" r="14" fill="#1E293B" stroke="#64748B" />
      <circle cx="330" cy="35" r="14" fill="#1E293B" stroke="#64748B" />

      <!-- Linhas de Dependência -->
      <line x1="64" y1="37" x2="160" y2="43" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="110" y1="85" x2="170" y2="60" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="270" y1="85" x2="210" y2="60" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="316" y1="37" x2="220" y2="43" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <!-- Legenda de Risco -->
    <text x="20" y="248" fill="#F87171" font-size="12" font-weight="600">❌ Vigilância policial, censura corporativa e apagamento unilateral.</text>
  </g>

  <!-- Painel Direito: Malha Descentralizada Vox -->
  <g transform="translate(495, 95)">
    <rect x="0" y="0" width="425" height="270" rx="12" fill="url(#gradGoodBox)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.4" />
    
    <!-- Badge -->
    <rect x="20" y="20" width="130" height="24" rx="12" fill="#064E3B" />
    <text x="32" y="36" fill="#D1FAE5" font-size="11" font-weight="800" font-family="'JetBrains Mono', monospace">VOX POPULI / P2P</text>

    <text x="20" y="70" fill="#FFFFFF" font-size="16" font-weight="800">A Malha Operária Local-First</text>
    <text x="20" y="90" fill="#94A3B8" font-size="12">Poder computacional distribuído em hardware popular</text>

    <!-- Diagrama Visual P2P Descentralizado -->
    <g transform="translate(20, 110)">
      <!-- Nós Populares (Sindicatos / PCs Antigos) -->
      <rect x="35" y="25" width="48" height="34" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
      <text x="59" y="46" fill="#A7F3D0" font-size="9" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', monospace">NÓ SIND</text>

      <rect x="170" y="15" width="48" height="34" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
      <text x="194" y="36" fill="#A7F3D0" font-size="9" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', monospace">NÓ BAIRRO</text>

      <rect x="305" y="25" width="48" height="34" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
      <text x="329" y="46" fill="#A7F3D0" font-size="9" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', monospace">NÓ OCUP</text>

      <!-- Aparelhos Celulares Militantes (Chaves no Bolso) -->
      <circle cx="100" cy="95" r="14" fill="#065F46" stroke="#34D399" />
      <text x="100" y="99" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">P-256</text>

      <circle cx="230" cy="95" r="14" fill="#065F46" stroke="#34D399" />
      <text x="230" y="99" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">P-256</text>

      <!-- Malha Horizontal P2P -->
      <line x1="83" y1="42" x2="170" y2="32" stroke="#10B981" stroke-width="1.5" />
      <line x1="218" y1="32" x2="305" y2="42" stroke="#10B981" stroke-width="1.5" />
      <line x1="60" y1="59" x2="90" y2="85" stroke="#34D399" stroke-width="1.5" />
      <line x1="180" y1="49" x2="114" y2="90" stroke="#34D399" stroke-width="1.5" />
      <line x1="205" y1="49" x2="225" y2="82" stroke="#34D399" stroke-width="1.5" />
      <line x1="315" y1="59" x2="242" y2="88" stroke="#34D399" stroke-width="1.5" />
      <line x1="114" y1="95" x2="216" y2="95" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2" />
    </g>

    <!-- Legenda de Segurança -->
    <text x="20" y="248" fill="#34D399" font-size="12" font-weight="600">✔ Dados no bolso, resiliência a blecautes e soberania operária.</text>
  </g>
</svg>
