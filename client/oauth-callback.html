<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Vox — concluindo login</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111316; color: #e2e2e6; font: 16px/1.5 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <p>Concluindo o login…</p>
    <script>
      // Retorno de OAuth (Bluesky, X, GitHub, Threads, TikTok, Instagram): guarda os parâmetros
      // só nesta aba e volta ao app, que conclui o login em Redes Vinculadas. Nada sai do aparelho.
      (function () {
        var q = new URLSearchParams(location.search);
        var data = {};
        ["code", "state", "iss", "error", "error_description"].forEach(function (k) {
          if (q.get(k)) data[k] = q.get(k);
        });
        try { sessionStorage.setItem("vox-oauth-callback", JSON.stringify(data)); } catch (e) {}
        var purpose = "";
        try { purpose = sessionStorage.getItem("vox-oauth-purpose") || ""; } catch (e) {}
        location.replace(purpose === "profile" ? "./#/" : "./#/settings/linked-accounts");
      })();
    </script>
  </body>
</html>
