<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Vox — voz do povo e comunidades nos seus aparelhos, sem controle central" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400..700;1,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem("vox-color-mode");
          if (m === "light" || m === "dark") {
            document.documentElement.setAttribute("data-color-mode", m);
            document.documentElement.style.colorScheme = m;
          }
        } catch (_e) {}
      })();
    </script>
    <title>Vox</title>
  </head>
  <body>
    <div id="app-root"></div>
    <div id="modal-container"></div>
    <div id="post-media-lightbox" class="post-lightbox" hidden role="dialog" aria-modal="true" aria-label="Visualização da imagem">
      <button type="button" class="post-lightbox-close" aria-label="Fechar">×</button>
      <img class="post-lightbox-img" alt="" />
    </div>
    <script>
      // Suporte a URLs curtas: query ?h=slug ou subdomínio wildcard (*.comunidade.tld)
      (function () {
        const q = new URLSearchParams(window.location.search);
        const qHandle = q.get("h") || q.get("handle");
        if (qHandle && (!window.location.hash || window.location.hash === "#/")) {
          window.location.hash = "#/h/" + encodeURIComponent(qHandle.replace(/^@/, "").toLowerCase());
        } else if (!window.location.hash || window.location.hash === "#/") {
          const host = window.location.hostname.toLowerCase();
          const isHostingPlatform = /pages\.dev$|github\.io$|workers\.dev$|vercel\.app$|netlify\.app$|localhost$|127\.0\.0\.1$/i.test(host);
          const parts = host.split(".");
          if (!isHostingPlatform && parts.length >= 3 && parts[0] !== "www" && !parts[0].startsWith("vox")) {
            window.location.hash = "#/h/" + encodeURIComponent(parts[0].toLowerCase());
          }
        }
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
