<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Celular velho com tela apagada emitindo sinal de nó Wi-Fi -->
  <defs>
    <linearGradient id="phone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Ondas de Sinal Wi-Fi / Radio Broadcast (Esquerda) -->
  <path d="M 12 24 A 14 14 0 0 0 12 40" fill="none" stroke="#3DDC84" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 6 18 A 22 22 0 0 0 6 46" fill="none" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 3"/>

  <!-- Ondas de Sinal Wi-Fi / Radio Broadcast (Direita) -->
  <path d="M 52 24 A 14 14 0 0 1 52 40" fill="none" stroke="#3DDC84" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 58 18 A 22 22 0 0 1 58 46" fill="none" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 3"/>

  <!-- Corpo do Celular -->
  <rect x="20" y="8" width="24" height="48" rx="5" fill="url(#phone-grad)" stroke="#3DDC84" stroke-width="1.8"/>
  <!-- Tela Apagada (Black Screen / Standby) -->
  <rect x="23" y="15" width="18" height="32" rx="2" fill="#040608"/>
  
  <!-- LED indicador de nó ativo (verde piscando na tela preta) -->
  <circle cx="32" cy="31" r="2.5" fill="#3DDC84"/>

  <!-- Alto-falante superior -->
  <line x1="28" y1="12" x2="36" y2="12" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Botão Home clássico -->
  <circle cx="32" cy="51" r="2" fill="none" stroke="#475569" stroke-width="1.2"/>
</svg>
