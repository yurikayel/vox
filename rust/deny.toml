# Política de cadeia de suprimentos para o workspace Rust (ADR-039 / LAN-20).
# Uso no CI: cargo deny check (a partir da raiz rust/).

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "openssl-sys", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
